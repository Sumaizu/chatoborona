<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Чатоборона — сцена боя</title>
<style>
  body { margin: 0; background: #15131f; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script type="module">
  import { Battle } from '../site/js/battle.js';
  import { Scene } from '../site/js/draw.js';
  import { makePath } from '../site/js/field.js';
  import { BOSSES, ELITES, LOOKS, MIMIC, TICK, waveHp, xpForLevel } from '../site/js/balance.js';

  const seeded = (seed) => {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const query = new URLSearchParams(location.search), seconds = Number(query.get('t')) || 6;
  const wave = Number(query.get('wave')) || 15, players = 6;
  const battle = new Battle(makePath(seeded(Number(query.get('map')) || 5)), { random: seeded(3) });
  battle.wave = wave;
  battle.players = players;
  const team = (query.get('team') || 'earth,miner,pyro,frost,alchemist,earth').split(',');
  team.forEach((cls, i) => {
    const hero = { name: cls + i, login: cls + i, xp: xpForLevel(30 + i * 9), kills: 0, assists: 0, coins: 0 };
    const spot = battle.bestCell(2.4);
    battle.place(hero, cls, spot.x, spot.y);
  });
  if (query.get('parasite') !== '0') {
    battle.placeRider({ name: 'bug', login: 'bug', xp: xpForLevel(55), kills: 0, assists: 0, coins: 0 }, 'parasite');
  }
  const looks = (query.get('mobs') || 'zombie,skeleton,imp,dog,crow,hellhound,brute,demon,rat,bat,zombie,imp')
    .split(',');
  const kinds = new Map(ELITES.concat(BOSSES, [MIMIC]).map((kind) => [kind.id, kind]));
  const toughness = Number(query.get('hp')) || 2.5;
  looks.forEach((id, i) => {
    const kind = kinds.get(id) || null;
    const type = kind ? (BOSSES.includes(kind) ? 'boss' : 'elite')
      : Object.keys(LOOKS).find((key) => LOOKS[key].some((look) => look.id === id));
    const look = kind ? null : LOOKS[type].find((item) => item.id === id);
    battle._spawn({ type, kind, look, hp: waveHp(wave, type, players) * toughness }, 2 + i * 1.6);
  });
  if (query.get('debuffs')) {
    const far = 1e9, mobs = battle.mobs;
    if (mobs[0]) Object.assign(mobs[0], { holdUntil: far, holdBy: 'frost' });
    if (mobs[1]) Object.assign(mobs[1], { holdUntil: far, holdBy: 'thunder' });
    if (mobs[2]) Object.assign(mobs[2], { markUntil: far, mark: 0.25 });
    if (mobs[3]) mobs[3].ward = 1e12;
    for (const mob of mobs) if (mob.power && mob.power.id === 'shield') mob.powerUntil = far;
    if (battle.towers[0]) battle.towers[0].stunUntil = far;
  }
  const scene = new Scene(document.getElementById('field'));
  scene.resize(Number(query.get('zoom')) || 2);
  for (let t = 0; t < seconds; t += TICK) {
    battle.step(TICK);
    scene.draw(battle, TICK, { names: new Set() });
  }
  if (query.get('nuke')) {
    const miner = battle.towers.find((t) => t.cls.id === 'miner');
    battle._nuke(miner, miner.cx, miner.cy);
    for (let t = 0; t < Number(query.get('nuke')); t += TICK) {
      battle.step(TICK);
      scene.draw(battle, TICK, { names: new Set() });
    }
  }
  window.__ready = true;
</script>
</body>
</html>
